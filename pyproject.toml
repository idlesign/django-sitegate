[project]
name = "django-sitegate"
dynamic = ["version"]
description = "Reusable application for Django to ease sign up & sign in processes"
authors = [
    { name = "Igor Starikov", email = "idlesign@yandex.ru" },
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["Django", "signup", "signin"]
dependencies = [
    "django-etc>=1.2.0",
    "django-siteprefs>=1.1.0",
    "requests",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
]

[project.urls]
Homepage = "https://github.com/idlesign/django-sitegate"
Documentation = "https://django-sitegate.readthedocs.io/"

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "linters" },
    { include-group = "tests" },
    { include-group = "runtime" },
]
docs = [
    "mkdocs-apidescribed-plugin",
    "mkdocs-material",
    "mkdocs-navsorted-plugin",
]
linters = [
    "ruff==0.13.1",
]
tests = [
    "coverage",
    "pytest",
    "pytest-djangoapp>=1.6.0",
    "pytest-responsemock",
]
runtime = [
    "Django>=3.2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sitegate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sitegate"]

[tool.hatch.build.targets.sdist]
packages = ["src/"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "--pyargs"

[tool.coverage.run]
source = [
    "src/sitegate",
]
omit = [
    "src/sitegate/migrations/*",
]

[tool.makeapp.tests]
deps = [
    "django~=${{ django-version }}.0",
]
