name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        django-version: ["5.2", "6.0", "6.1"]

        exclude:
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"
          - python-version: "3.15"
            django-version: "5.2"
          - python-version: "3.15"
            django-version: "6.0"

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }} & Django ${{ matrix.django-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
    - name: Install deps
      run: |
        uv sync --only-group tests
        uv pip install -e . coveralls "Django~=${{ matrix.django-version }}.0"
    - uses: astral-sh/ruff-action@v4.1.0
      with:
        version: 0.17.5
        args: check
    - name: Run tests
      env:
        GITHUB_TOKEN: ${{ secrets.github_token }}
      run: |
        uv run --no-sync coverage run -m pytest
        uv run --no-sync coveralls --service=github
